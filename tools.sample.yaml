# tool_launcher 追加ツール定義（任意）
# ------------------------------------------------------------------
# このファイルを tools.yaml にコピーすると、menu.py を編集せずに
# メニューへツールを追加できます。ファイルが無い場合は何も起きません。
#
# 対象は「引数を選んで実行するだけ」の単純なツールです。
# 日付選択などの複雑な操作が必要な場合は menu.py にハンドラを書いてください。
# ------------------------------------------------------------------

tools:
  - label: "サンプルツール"          # メニューに表示する名前（必須）
    tool_dir: "sample_tool"          # ws/ 配下のディレクトリ名（必須）
    script: "main.py"                # 実行するスクリプト（省略時 main.py）
    options:                         # 省略すると引数なしで即実行
      - label: "通常実行"
        args: []
      - label: "ドライラン"
        args: ["--dry-run"]
      - label: "詳細ログ付き実行"
        args: ["-v"]
